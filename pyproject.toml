[project]
name = "contrast-ratio-kit"
version = "0.1.0"
description = "Python tool for measuring color contrast and evaluating WCAG AA/AAA compliance"
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
